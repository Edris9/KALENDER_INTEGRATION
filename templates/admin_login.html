<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase Admin – Login</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='admin-login.css') }}">
</head>
<body>

    <div class="login-card">
        <div class="logo">Showcase Admin</div>
        <div class="subtitle">Sign in to manage clients & bookings</div>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" autocomplete="on">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='admin-login.js') }}"></script>

</body>
</html>
