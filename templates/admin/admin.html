<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="nav-left">
            <span class="logo">Showcase Admin</span>
        </div>
        <div class="nav-right">
            <button class="logout-btn" onclick="window.location.href='/admin/logout'">Logout</button>
        </div>
    </div>

    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Connected Clients</h2>
            </div>
            <div id="clients-list">
                <div class="empty">No clients connected yet.</div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- PLACEHOLDER när ingen klient är vald -->
            <div id="placeholder" class="placeholder">
                
                <img src="https://raw.githubusercontent.com/Edris9/KALENDER_INTEGRATION/main/E-mail_tempelate/imag.png" width="100" style="margin:0; display:block; margin:0 auto 20px;"/>
                <p>Select a client to view their calendar</p>
            </div>

            <!-- KALENDER + FLIKAR (visas när klient väljs) -->
            <div id="client-details-tabs" style="display:none;">

                <div class="tabs-header">
                    <button class="tab-btn active" data-tab="calendar">Calendar</button>
                    <button class="tab-btn" data-tab="history">Meeting History <span id="history-badge" style="display:none; background:#e53935; color:white; border-radius:50%; padding:1px 6px; font-size:11px; margin-left:4px;"></span></button>
                    <button class="tab-btn" data-tab="reminders">Reminders</button>
                    <button class="tab-btn" data-tab="stats">Statistics</button>
                    <button class="tab-btn" data-tab="cancel">Cancellation</button>
                    <button class="tab-btn" data-tab="reschedule">Reschedule</button>
                    <button class="tab-btn" data-tab="noshow">No-show</button>
                    <button class="tab-btn" data-tab="export">CRM Export</button>
                </div>

                <!-- KALENDER TAB -->
                <div class="tab-content" id="tab-calendar">
                    <div class="section">
                        <h2><span id="selected-client-name"></span>'s Calendar</h2>
                        <div id="cal-wrap"></div>  <!-- ← lägg till denna -->
                    </div>

                    <!-- BOKNINGSFORMULÄR -->
                    <div class="section" id="admin-booking-form" style="display:none;">
                        <h2>Book a Meeting</h2>
                        <div id="admin-selected-info"></div>
                        <input type="text" id="lead-name" placeholder="Lead's full name" />
                        <input type="email" id="lead-email" placeholder="Lead's email" />
                        <button class="book-btn" onclick="adminBookMeeting()">Confirm Booking</button>
                    </div>

                    <!-- BEKRÄFTELSE -->
                    <div class="section confirmation" id="admin-confirmation" style="display:none;">
                        <div class="icon">🎉</div>
                        <h2>Meeting Booked!</h2>
                        <p>The calendar invite has been sent.</p>
                        <button class="book-btn" onclick="location.reload()">Book Another</button>
                    </div>
                </div>

                <!-- ÖVRIGA FLIKAR -->
                <div class="tab-content" id="tab-history" style="display:none;">
                    <div class="section"><div class="coming-soon">🚧 Coming soon</div></div>
                </div>
                <div class="tab-content" id="tab-status" style="display:none;">
                    <div class="section"><div class="coming-soon">🚧 Coming soon</div></div>
                </div>
                <div class="tab-content" id="tab-reminders" style="display:none;">
                    <div class="section"><div class="coming-soon">🚧 Coming soon</div></div>
                </div>
                <div class="tab-content" id="tab-stats" style="display:none;">
                    <div class="section"><div class="coming-soon">🚧 Coming soon</div></div>
                </div>
                <div class="tab-content" id="tab-cancel" style="display:none;">
                    <div class="section"><div class="coming-soon">🚧 Coming soon</div></div>
                </div>
                <div class="tab-content" id="tab-reschedule" style="display:none;">
                    <div class="section"><div class="coming-soon">🚧 Coming soon</div></div>
                </div>
                <div class="tab-content" id="tab-noshow" style="display:none;">
                    <div class="section"><div class="coming-soon">🚧 Coming soon</div></div>
                </div>
                <div class="tab-content" id="tab-export" style="display:none;">
                    <div class="section"><div class="coming-soon">🚧 Coming soon</div></div>
                </div>

            </div>

        </main>
    </div>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
