<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Showcase Calendar – Book a Time</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<div class="container">

  <div class="header">
    <button onclick="window.location.href='/admin/login'" style="margin-top: 12px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px;">
      🔐 Login as Admin
    </button>
</div>

  <div class="header">
    <h1>📅 Showcase Calendar</h1>
    <div class="subtitle">Book a meeting at a time that suits you</div>
  </div>

  <div id="login-section" class="login-section" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <button class="book-btn connect-google" style="width: 220px; padding: 10px 0;" onclick="window.location.href='/login'">
      <img src="https://img.icons8.com/?size=100&id=WKF3bm1munsk&format=png&color=000000" alt="Google Calendar" style="height: 24px; vertical-align: middle; margin-right: 8px;">
      Connect Google Calendar
    </button>
    <button class="book-btn connect-microsoft" style="width: 220px; padding: 3px 0;" onclick="window.location.href='/microsoft/login'">
      <img src ="https://img.icons8.com/?size=100&id=kzZctsAbGur5&format=png&color=000000" alt="Microsoft Calendar" style="height: 24px; vertical-align: middle; margin-right: 8px;">
      Connect Microsoft Calendar
    </button>
  </div>

  <div id="main-content" style="display:none;">

    <div class="week-nav">
      <button onclick="changeWeek(-1)">←</button>
      <div class="week-title" id="week-title">Week 10, 2026</div>
      <button onclick="changeWeek(1)">→</button>
    </div>

    <div class="calendar-grid" id="calendar-grid"></div>

    <div class="booking-form" id="booking-form">
      <div class="selected-info" id="selected-info"></div>
      <input type="text" id="name" placeholder="Your full name" required />
      <input type="email" id="email" placeholder="Your email address" required />
      <button class="book-btn" onclick="bookMeeting()">Confirm Booking</button>
    </div>

    <div class="confirmation" id="confirmation">
      <div class="icon">🎉</div>
      <h2>Meeting Booked!</h2>
      <p>Check your email for the calendar invitation.</p>
      <button class="book-btn new-booking" onclick="location.reload()">
        Book Another Meeting
      </button>
    </div>

  </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
